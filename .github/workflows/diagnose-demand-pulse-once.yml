name: Diagnose Demand Pulse Once

on:
  push:
    branches:
      - feat/official-source-monitor

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip diagnose-once]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-source-monitor
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gates independently
        shell: bash
        run: |
          set +e
          report="docs/demand-pulse/canaries/onfarmcompost-ci-report.txt"
          : > "$report"

          run_gate() {
            name="$1"
            shift
            output="$(mktemp)"
            "$@" >"$output" 2>&1
            code=$?
            {
              echo "===== $name (exit $code) ====="
              tail -n 250 "$output"
              echo
            } >> "$report"
            rm -f "$output"
          }

          run_gate prettier pnpm exec prettier --check .
          run_gate knip pnpm exec knip
          run_gate typescript pnpm exec tsc -b --noEmit
          run_gate oxlint pnpm exec oxlint .

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demand-pulse/canaries/onfarmcompost-ci-report.txt
          git commit -m "chore(ci): capture Demand Pulse gate diagnostics [skip diagnose-once]"
          git push origin HEAD:feat/official-source-monitor
