name: Format Demand Pulse Once

on:
  push:
    branches:
      - feat/official-source-monitor

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format-once]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/official-source-monitor
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed Demand Pulse files
        run: |
          pnpm exec prettier --write \
            src/server.ts \
            src/server/features/demand-pulse/README.md \
            src/server/features/demand-pulse/__tests__/official-monitor.test.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-monitor.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-sources.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-store.ts \
            src/server/features/demand-pulse/feature-flags.ts \
            src/server/features/demand-pulse/index.ts

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/server.ts \
            src/server/features/demand-pulse/README.md \
            src/server/features/demand-pulse/__tests__/official-monitor.test.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-monitor.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-sources.ts \
            src/server/features/demand-pulse/canaries/onfarmcompost-official-store.ts \
            src/server/features/demand-pulse/feature-flags.ts \
            src/server/features/demand-pulse/index.ts
          git commit -m "style(demand-pulse): format official monitor refactor [skip format-once]"
          git push origin HEAD:feat/official-source-monitor
